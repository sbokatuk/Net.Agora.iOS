name: build

# Reusable pipeline: packs every package in build/packages.tsv — each at its own version from
# Directory.Build.props, optionally suffixed for prereleases — validates the result, builds the
# MAUI sample against the packed package, and runs the simulator smoke tests.

on:
  workflow_call:
    inputs:
      suffix:
        description: >
          Optional prerelease suffix (e.g. beta.12.34) appended to every package's own version.
          The packages sit on independent native version lines (RTC 4.6.x, RTM 2.2.x), so there
          is no single version to stamp — each packs at its own pin from Directory.Build.props.
        required: false
        default: ''
        type: string
      e2e-target-frameworks:
        description: >
          Which of the package's target frameworks the simulator smoke tests run against, as a JSON
          array. Defaults to the two extremes: net8, the oldest asset set and the one nothing else
          exercises, and net10, whose assets are produced by the merge step in BuildNugets.sh and so
          are the only ones that could be grafted in wrong. net9 sits between them and comes out of
          the same pack pass as net8, so testing it too would buy little for the runner minutes.
        required: false
        default: '["net8.0-ios18.0", "net10.0-ios26.0"]'
        type: string

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: pack
    # Pinned rather than macos-latest so an image roll cannot change which Xcode versions are
    # available to select-xcode.sh.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS workloads for every SDK band
        run: |
          for major in 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install ios )
          done

      - name: Cache the fetched xcframeworks
        id: xcframeworks
        uses: actions/cache@v4
        with:
          # A glob rather than a list: there are sixteen of these directories now, twelve of
          # them extensions, and a package whose lib/ was left out of this list restores from
          # cache with nothing in it — which fails the build in a way that reads like a broken
          # fetch script rather than a stale workflow. That is exactly how the extensions failed
          # the first time they ran here.
          path: src/*/lib
          key: agora-ios-xcframeworks-${{ hashFiles('Directory.Build.props', 'build/checksums.txt') }}

      - name: Fetch the Agora iOS SDKs
        if: steps.xcframeworks.outputs.cache-hit != 'true'
        run: |
          ./build/fetch-video.sh
          ./build/fetch-voice.sh
          ./build/fetch-signaling.sh
          ./build/fetch-chat.sh
          ./build/fetch-extensions.sh

      - name: Pack
        run: |
          if [ -n "${{ inputs.suffix }}" ]; then
            ./build/BuildNugets.sh --suffix "${{ inputs.suffix }}"
          else
            ./build/BuildNugets.sh
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  validate:
    name: validate packages
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run package tests
        run: dotnet test tests/Net.Agora.iOS.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  sample:
    name: build sample app
    timeout-minutes: 30
    needs: pack
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # The sample consumes the packed package exactly as a user would: it restores from
      # artifacts/ (see NuGet.config) and links against AgoraRtcEngineKit directly, with no
      # cross-platform façade in between.
      #
      # Debug, and pinned to a simulator runtime identifier: a Release build triggers full AOT
      # compilation and linking, which with the AgoraRtcKit framework costs real runner time for
      # no added signal on whether the package restores and links correctly — same reasoning as
      # FFmpegKit.iOS's sample job, whose first attempt at a Release build was killed after 48
      # minutes. Both target frameworks the .NET 9 band covers are built, since at this cost it is
      # free; the sample deliberately does not target net10 — the device tests cover that.
      - name: Build the samples against the packed packages
        run: |
          # Exact versions come from the pins plus the optional prerelease suffix — see
          # build/pins.sh, and every package a sample references needs its own: the Video sample
          # also consumes the Signaling package (the coexistence proof), whose unsuffixed default
          # would not exist on a prerelease run. The Voice sample is its own app, since the two
          # RTC packages cannot share one.
          . ./build/pins.sh
          s="${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          dotnet build samples/Net.Agora.Sample.iOS \
            --configuration Debug \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:AgoraVideoPackageVersion="${AGORA_VIDEO_PACKAGE_VERSION}${s}" \
            -p:AgoraSignalingPackageVersion="${AGORA_SIGNALING_PACKAGE_VERSION}${s}"
          dotnet build samples/Net.Agora.Sample.Voice.iOS \
            --configuration Debug \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:AgoraVoicePackageVersion="${AGORA_VOICE_PACKAGE_VERSION}${s}"

  e2e:
    name: simulator smoke test (${{ matrix.package }}, ${{ matrix.target-framework }})
    timeout-minutes: 45
    needs: pack
    runs-on: macos-15
    strategy:
      # fail-fast off: when one leg breaks it is worth knowing whether the others did too, since
      # "net8 only", "Voice only" and "all of them" point at very different causes.
      fail-fast: false
      matrix:
        # One leg per package: the RTC pair ship a framework named AgoraRtcKit, so a single
        # device test app holds exactly one of them — see tests/Net.Agora.iOS.DeviceTests.
        # Signaling has no leg here yet: its packed binding is exercised end to end by the façade
        # repository's own simulator suite, and this repository's package tests cover its layout
        # and API surface.
        package: [Video, Voice]
        target-framework: ${{ fromJSON(inputs.e2e-target-frameworks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS workload
        run: |
          # The device app is built for the target framework under test, so install the workload
          # for the band that owns it. global.json pins .NET 9; the app may need .NET 10.
          mkdir -p "${RUNNER_TEMP}/sdk10"
          ( cd "${RUNNER_TEMP}/sdk10" \
            && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install ios )
          dotnet workload install ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run smoke tests on simulator
        run: |
          . ./build/pins.sh
          case "${{ matrix.package }}" in
            Video) base="${AGORA_VIDEO_PACKAGE_VERSION}" ;;
            Voice) base="${AGORA_VOICE_PACKAGE_VERSION}" ;;
            Signaling) base="${AGORA_SIGNALING_PACKAGE_VERSION}" ;;
          esac
          version="${base}${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          ./.github/scripts/run-simulator-tests.sh "${version}" "${{ matrix.target-framework }}" "${{ matrix.package }}"

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-logs-${{ matrix.package }}-${{ matrix.target-framework }}
          path: simulator-tests.log
          if-no-files-found: ignore
          retention-days: 7
