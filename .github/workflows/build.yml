name: build

# Reusable pipeline: packs every package in build/packages.tsv at a given version and validates
# the result. Callers (pr.yml, release.yml) decide the version and what to do with it.

on:
  workflow_call:
    inputs:
      version:
        description: NuGet version to stamp on every package.
        required: true
        type: string

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: pack
    # Pinned rather than macos-latest so an image roll cannot change which Xcode versions are
    # available to select-xcode.sh.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS workloads for every SDK band
        run: |
          for major in 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install ios )
          done

      - name: Cache the fetched xcframeworks
        id: xcframeworks
        uses: actions/cache@v4
        with:
          path: src/Net.Agora.Video.iOS/lib
          key: agora-video-ios-xcframeworks-${{ hashFiles('Directory.Build.props', 'build/checksums.txt') }}

      - name: Fetch the Agora Video iOS SDK
        if: steps.xcframeworks.outputs.cache-hit != 'true'
        run: ./build/fetch-video.sh

      - name: Pack
        run: ./build/BuildNugets.sh "${{ inputs.version }}"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

      - name: Build the sample against the packed packages
        run: |
          # Proves the package is actually consumable: it restores from artifacts/ (see
          # NuGet.config) and links against AgoraRtcEngineKit directly, with no cross-platform
          # façade in between. Debug, and pinned to a simulator runtime identifier: a Release build
          # triggers full AOT compilation and linking, which with the ~25 MB AgoraRtcKit framework
          # costs real runner time for no added signal on whether the package restores and links
          # correctly — same reasoning as the façade repo's sample build step.
          dotnet build samples/Net.Agora.Sample.iOS \
            -c Debug -f net9.0-ios18.0 \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:AgoraVideoPackageVersion="${{ inputs.version }}"

  validate:
    name: validate packages
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run package tests
        run: dotnet test tests/Net.Agora.iOS.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7
