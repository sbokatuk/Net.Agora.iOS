name: build

# Reusable pipeline: packs every package in build/packages.tsv — each at its own version from
# Directory.Build.props, optionally suffixed for prereleases — validates the result, builds the
# MAUI sample against the packed package, and runs the simulator smoke tests.

on:
  workflow_call:
    inputs:
      suffix:
        description: >
          Optional prerelease suffix (e.g. beta.12.34) appended to every package's own version.
          The packages sit on independent native version lines (RTC 4.6.x, RTM 2.2.x), so there
          is no single version to stamp — each packs at its own pin from Directory.Build.props.
        required: false
        default: ''
        type: string
      track:
        description: >
          Restrict the build to one release track — rtc, signaling, chat, whiteboard or fastboard
          (see build/tracks.tsv). Packs only that track's packages and skips the CI-only jobs
          (validate, sample, e2e), which the pull request that merged this commit already ran.
          Empty, the default, builds and validates the whole repository — what push and
          pull_request want. Releases set it, so a per-track tag publishes only its own track.
        required: false
        default: ''
        type: string
      e2e-target-frameworks:
        description: >
          Which of the package's target frameworks the simulator smoke tests run against, as a JSON
          array. Defaults to the two extremes: net8, the oldest asset set and the one nothing else
          exercises, and net10, whose assets are produced by the merge step in BuildNugets.sh and so
          are the only ones that could be grafted in wrong. net9 sits between them and comes out of
          the same pack pass as net8, so testing it too would buy little for the runner minutes.
        required: false
        default: '["net8.0-ios18.0", "net10.0-ios26.0"]'
        type: string

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: pack
    # Pinned rather than macos-latest so an image roll cannot change which Xcode versions are
    # available to select-xcode.sh.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS workloads for every SDK band
        run: |
          for major in 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install ios )
          done

      - name: Cache the fetched xcframeworks
        id: xcframeworks
        uses: actions/cache@v4
        with:
          # A glob rather than a list: there are sixteen of these directories now, twelve of
          # them extensions, and a package whose lib/ was left out of this list restores from
          # cache with nothing in it — which fails the build in a way that reads like a broken
          # fetch script rather than a stale workflow. That is exactly how the extensions failed
          # the first time they ran here.
          path: src/*/lib
          key: agora-ios-xcframeworks-${{ hashFiles('Directory.Build.props', 'build/checksums.txt') }}

      - name: Fetch and build the Agora iOS SDKs
        if: steps.xcframeworks.outputs.cache-hit != 'true'
        run: |
          ./build/fetch-video.sh
          ./build/fetch-voice.sh
          ./build/fetch-signaling.sh
          ./build/fetch-chat.sh
          ./build/fetch-extensions.sh
          # Whiteboard and Fastboard have no prebuilt binary to fetch — netless ships CocoaPods
          # source pods — so these clone a pinned commit and xcodebuild an xcframework from it.
          # They are slow (an archive per platform, then -create-xcframework), which is what the
          # cache above exists for: on a hit this whole step is skipped, and the cache key covers
          # their pins (Directory.Build.props + the git: commit lines in build/checksums.txt).
          ./build/build-whiteboard.sh
          ./build/build-fastboard.sh

      - name: Pack
        run: |
          args=""
          [ -n "${{ inputs.track }}" ] && args="$args --track ${{ inputs.track }}"
          [ -n "${{ inputs.suffix }}" ] && args="$args --suffix ${{ inputs.suffix }}"
          ./build/BuildNugets.sh $args

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  validate:
    name: validate packages
    needs: pack
    # Skipped on a scoped track release: the package tests assert the whole package set, which a
    # single-track pack does not produce — and the merged commit already ran them on its PR.
    if: ${{ inputs.track == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run package tests
        run: dotnet test tests/Net.Agora.iOS.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  sample:
    name: build sample app (${{ matrix.sample }})
    # A Release build is several times a Debug one — it runs the managed linker and then AOT
    # compiles every assembly, per target framework. Measured at ~9 minutes for one sample's two
    # target frameworks on a developer machine, and CI runners are slower.
    timeout-minutes: 90
    needs: pack
    # Off on a scoped track release — the tagged commit was validated on its PR. See validate.
    if: ${{ inputs.track == '' }}
    runs-on: macos-15
    strategy:
      # One leg per sample rather than three builds in one job. Release is expensive enough that
      # three of them in series is a job that either times out or tells you nothing until it does,
      # and a leg per sample says which app broke without reading a log.
      #
      # It also bounds disk. A Release build of one of these leaves about 5 GB in obj/ — AOT
      # writes an assembly listing per assembly before the native toolchain consumes it — and
      # three samples in one working copy is enough to fill a runner. Worth knowing because of how
      # it fails: the AOT compiler is killed mid-write and MSBuild reports only "the AOT compiler
      # exited with code 1", with no message and nothing about disk. Observed while developing
      # this change, twice, before the cause was obvious.
      fail-fast: false
      matrix:
        sample: [Net.Agora.Sample.iOS, Net.Agora.Sample.Voice.iOS, Net.Agora.Sample.Signaling.iOS]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # The sample consumes the packed package exactly as a user would: it restores from
      # artifacts/ (see NuGet.config) and links against AgoraRtcEngineKit directly, with no
      # cross-platform façade in between.
      #
      # Release, not Debug. Debug leaves the managed linker switched off, so it could only answer
      # whether the package restores and compiles — and a binding package's most interesting
      # failure is downstream of that: the linker walks the whole assembly graph, and types
      # reachable only through the Objective-C runtime are exactly the shape it can decide are
      # dead. Release is also what turns on AOT, which is the other step a Debug build never runs.
      # Both target frameworks the .NET 9 band covers are built; the samples deliberately do not
      # target net10 — the device tests cover that.
      - name: Build the sample against the packed packages
        run: |
          # Exact versions come from the pins plus the optional prerelease suffix — see
          # build/pins.sh. All three are passed to every sample: a project ignores a property it
          # never reads, and the alternative is a per-sample list that goes stale the first time a
          # sample picks up another package. They cannot be left to default on a prerelease run,
          # where the unsuffixed version does not exist.
          . ./build/pins.sh
          s="${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          dotnet build "samples/${{ matrix.sample }}" \
            --configuration Release \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:AgoraVideoPackageVersion="${AGORA_VIDEO_PACKAGE_VERSION}${s}" \
            -p:AgoraVoicePackageVersion="${AGORA_VOICE_PACKAGE_VERSION}${s}" \
            -p:AgoraSignalingPackageVersion="${AGORA_SIGNALING_PACKAGE_VERSION}${s}"

  # What the sample job still cannot reach, because a simulator build is a different build.
  #
  # A Release simulator build does AOT compile (the SDK reaches for the
  # Cross.iossimulator-arm64 pack), but everything native about it is the simulator: the AOT
  # target, and a link against the simulator slice of every xcframework. A device runtime
  # identifier is the configuration a shipping app is actually built with — AOT for arm64, and a
  # native link against the *device* slice, which is a separate slice built from a separate
  # archive and which nothing else in this pipeline links at all. The simulator legs would stay
  # green through a package whose device slice was empty, mis-stripped or built for the wrong
  # minimum OS version; this job is what notices.
  #
  # Two samples rather than all three: Video carries the largest native payload here (six
  # xcframeworks, including the video_dec that AgoraRtcKit's binary links by path), and Signaling
  # is the one whose device slice build/fetch-signaling.sh strips armv7 out of — so between them
  # they cover both ways an arm64-only link can go wrong. The Voice sample links the same
  # AgoraRtcKit machinery as Video by a different route.
  device-link:
    name: link for a device (${{ matrix.sample }})
    timeout-minutes: 45
    needs: pack
    # Off on a scoped track release — the tagged commit was validated on its PR. See validate.
    if: ${{ inputs.track == '' }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sample: [Net.Agora.Sample.iOS, Net.Agora.Sample.Signaling.iOS]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # One target framework, not both. Each band carries its own copy of the payload in the
      # package, but the copies hold the same frameworks entry for entry — which the package tests
      # assert directly, in Native_payload_is_the_same_across_target_frameworks — so a second band
      # would spend another quarter of an hour linking native bits this one has already linked.
      #
      # Code signing off, because a public runner has neither a certificate nor a provisioning
      # profile, and neither affects whether the thing links. That leaves the .app itself as the
      # assertion: AOT and the native link both run before the bundle is assembled, so a failure
      # in either never gets far enough to produce one.
      - name: Link the sample for a real device
        run: |
          . ./build/pins.sh
          s="${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          tfm=net9.0-ios18.0
          dotnet build "samples/${{ matrix.sample }}" \
            --configuration Release \
            --framework "${tfm}" \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:AgoraVideoPackageVersion="${AGORA_VIDEO_PACKAGE_VERSION}${s}" \
            -p:AgoraVoicePackageVersion="${AGORA_VOICE_PACKAGE_VERSION}${s}" \
            -p:AgoraSignalingPackageVersion="${AGORA_SIGNALING_PACKAGE_VERSION}${s}"

          app="samples/${{ matrix.sample }}/bin/Release/${tfm}/ios-arm64/${{ matrix.sample }}.app"
          if [ ! -d "${app}" ]; then
            echo "::error::${app} was not produced"
            exit 1
          fi

          # Reported rather than asserted on a count: how many assemblies survive the linker is
          # the linker's business and moves with every SDK update. Zero of them would mean the
          # build produced a bundle without AOT compiling anything, which is worth failing on.
          images="$(find "${app}" -name '*.aotdata.arm64' | wc -l | tr -d ' ')"
          echo "==> ${app}: ${images} AOT images"
          if [ "${images}" -eq 0 ]; then
            echo "::error::no AOT images in ${app} — the device build did not AOT compile"
            exit 1
          fi

  e2e:
    name: simulator smoke test (${{ matrix.package }}, ${{ matrix.target-framework }})
    timeout-minutes: 45
    needs: pack
    # Off on a scoped track release — the tagged commit was device-tested on its PR. See validate.
    if: ${{ inputs.track == '' }}
    runs-on: macos-15
    strategy:
      # fail-fast off: when one leg breaks it is worth knowing whether the others did too, since
      # "net8 only", "Voice only" and "all of them" point at very different causes.
      fail-fast: false
      matrix:
        # One leg per package, because one app holds one product — see
        # tests/Net.Agora.iOS.DeviceTests. The RTC pair ship a framework named AgoraRtcKit;
        # Whiteboard and Fastboard both carry netless's static library and both declare
        # Whiteboard_Whiteboard.bundle.
        #
        # Signaling and Chat are separate products (AgoraRtmKit, AgoraChat) and each gets its own
        # leg, which is also where the generated awaitable surface is exercised against the real
        # SDK rather than asserted from package metadata. The board legs are the only place the
        # resource bundles are checked in a real app bundle: the package tests can see them inside
        # the .nupkg, but nothing else here proves the buildTransitive/ .targets fires and stages
        # them where the SDK's own bundle finder looks — and a missing bundle renders a blank board
        # with no error at all.
        package: [Video, Voice, Signaling, Chat, Whiteboard, Fastboard]
        target-framework: ${{ fromJSON(inputs.e2e-target-frameworks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS workload
        run: |
          # The device app is built for the target framework under test, so install the workload
          # for the band that owns it. global.json pins .NET 9; the app may need .NET 10.
          mkdir -p "${RUNNER_TEMP}/sdk10"
          ( cd "${RUNNER_TEMP}/sdk10" \
            && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install ios )
          dotnet workload install ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run smoke tests on simulator
        run: |
          . ./build/pins.sh
          case "${{ matrix.package }}" in
            Video) base="${AGORA_VIDEO_PACKAGE_VERSION}" ;;
            Voice) base="${AGORA_VOICE_PACKAGE_VERSION}" ;;
            Signaling) base="${AGORA_SIGNALING_PACKAGE_VERSION}" ;;
            Chat) base="${AGORA_CHAT_PACKAGE_VERSION}" ;;
            Whiteboard) base="${AGORA_WHITEBOARD_PACKAGE_VERSION}" ;;
            Fastboard) base="${AGORA_FASTBOARD_PACKAGE_VERSION}" ;;
          esac
          version="${base}${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          ./.github/scripts/run-simulator-tests.sh "${version}" "${{ matrix.target-framework }}" "${{ matrix.package }}"

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-logs-${{ matrix.package }}-${{ matrix.target-framework }}
          path: simulator-tests.log
          if-no-files-found: ignore
          retention-days: 7
