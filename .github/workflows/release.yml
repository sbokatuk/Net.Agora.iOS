name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag is the release train's label, not a version to stamp: the packages sit on
  # independent native version lines (RTC 4.6.x, RTM 2.2.x) and each publishes at its own pin
  # from Directory.Build.props. Republishing a package whose pin did not move is a no-op — the
  # push below uses --skip-duplicate.
  build:
    name: build
    uses: ./.github/workflows/build.yml

  publish:
    name: publish to nuget.org and create release
    needs: [build]
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Authenticate to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Compose release notes
        run: |
          . ./build/pins.sh
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          # A curated docs/release-notes/<version>.md replaces the generated commit list when one
          # exists. The second lookup drops the prerelease suffix, so v4.6.2.1-beta.2 reuses the
          # notes written for 4.6.2.1 rather than silently falling back to raw commit subjects.
          # Tags are the train label, e.g. v4.6.2.2 for an RTC-led train.
          notes="docs/release-notes/${GITHUB_REF_NAME#v}.md"

          {
            if [ -f "${notes}" ]; then
              echo "==> using curated notes from ${notes}" >&2
              cat "${notes}"
              echo
              if [ -n "${previous}" ]; then
                echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${previous}...${GITHUB_REF_NAME}"
              fi
            else
              echo "## What's changed"
              echo
              if [ -n "${previous}" ]; then
                git log --no-merges --pretty='- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
                echo
                echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${previous}...${GITHUB_REF_NAME}"
              else
                echo "Initial release."
              fi
            fi
            echo
            echo "## Packages"
            echo
            echo "Bound against AgoraRtcEngine_iOS \`${AGORA_VIDEO_IOS_VERSION}\`, AgoraAudio_iOS \`${AGORA_VOICE_IOS_VERSION}\`, AgoraRtm_iOS \`${AGORA_SIGNALING_IOS_VERSION}\` and Agora_Chat_iOS \`${AGORA_CHAT_IOS_VERSION}\` (CocoaPods trunk). Each package publishes at its own version line; a row whose version did not move since the previous train was skipped by the push, not republished."
            echo
            echo "| Package | NuGet |"
            echo "| --- | --- |"
            echo "| \`Net.Agora.Video.iOS\` | [${AGORA_VIDEO_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Video.iOS/${AGORA_VIDEO_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Voice.iOS\` | [${AGORA_VOICE_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Voice.iOS/${AGORA_VOICE_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Signaling.iOS\` | [${AGORA_SIGNALING_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Signaling.iOS/${AGORA_SIGNALING_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Chat.iOS\` | [${AGORA_CHAT_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Chat.iOS/${AGORA_CHAT_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Extensions.*.iOS\` (12) | [${AGORA_VIDEO_PACKAGE_VERSION}](https://www.nuget.org/packages?q=Net.Agora.Extensions) |"
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
